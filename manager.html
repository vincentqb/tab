<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tab Organizer</title>
    <link rel="stylesheet" href="manager.css" />
  </head>
  <body>
    <header class="toolbar">
      <div class="toolbar-group">
        <h1 class="brand">Tab Organizer</h1>
        <span id="stat" class="stat" aria-live="polite"></span>
      </div>

      <nav class="toolbar-group" role="tablist" aria-label="View mode">
        <button
          class="view-btn"
          data-view="window"
          role="tab"
          title="Your windows exactly as they are now"
        >
          Current
        </button>
        <button class="view-btn" data-view="domain" role="tab" title="By site, one column each">
          Domain
        </button>
        <button
          class="view-btn"
          data-view="path"
          role="tab"
          title="By words in the URL after the site name"
        >
          Path
        </button>
        <button class="view-btn" data-view="title" role="tab" title="By words in the page title">
          Title
        </button>
      </nav>

      <div class="toolbar-group">
        <input
          id="search"
          class="search"
          type="search"
          placeholder="Search"
          title="Hides tabs that don't match. Each Enter groups the matches into a new column."
          autocomplete="off"
        />
        <button
          id="visual-btn"
          class="action-btn"
          aria-pressed="false"
          title="Show page thumbnails (asks for capture permission)"
        >
          Visual
        </button>
        <button id="dedupe-btn" class="action-btn" title="Close every duplicate but the leftmost">
          Dedupe
        </button>
        <button
          id="save-btn"
          class="action-btn"
          title="Save these tabs, grouped as shown, to a file"
        >
          Save
        </button>
        <button
          id="import-btn"
          class="action-btn"
          title="Open a saved file: each group becomes a new window"
        >
          Import
        </button>
        <input id="import-file" type="file" accept="application/json,.json" hidden />
        <button
          id="apply-btn"
          class="action-btn primary"
          title="Rearrange your real Firefox windows to match the board"
        >
          Apply
        </button>
        <button id="refresh-btn" class="action-btn" title="Reload tabs from the browser">
          Refresh
        </button>
      </div>
    </header>

    <div id="banner" class="banner" hidden></div>

    <main id="board" class="board" aria-label="Tab columns"></main>

    <template id="column-tpl">
      <section class="column" aria-label="tab column">
        <div class="column-head" draggable="true" title="Drag to reorder columns on the board">
          <span class="column-label"></span>
          <span class="column-count"></span>
          <button class="column-drop" aria-label="Ungroup this search" hidden>&times;</button>
        </div>
        <ul class="tablist"></ul>
      </section>
    </template>

    <template id="card-tpl">
      <li class="card" draggable="true">
        <img class="favicon" alt="" width="16" height="16" />
        <div class="card-body">
          <span class="card-title"></span>
          <span class="card-host"></span>
        </div>
        <img class="thumb" alt="" hidden />
        <button class="card-close" title="Close tab" aria-label="Close tab">&times;</button>
      </li>
    </template>

    <script type="module" src="src/manager.js"></script>
  </body>
</html>
