# Pre-commit gate for this repo. Bootstrap:
#   uvx pre-commit install          # wires the pre-commit stage
#   uvx pre-commit run --all-files  # run over the whole repo
#   uvx pre-commit autoupdate       # bump every rev: deliberately, review the diff
# Schema: https://pre-commit.com

repos:
  # --- language-agnostic hygiene ---
- repo: https://github.com/codespell-project/codespell
  rev: v2.4.3
  hooks:
  - id: codespell

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: end-of-file-fixer
  - id: mixed-line-ending
  - id: trailing-whitespace
  - id: check-json
  - id: check-yaml
  - id: check-merge-conflict
  - id: check-added-large-files

- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.16.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix]

  # --- format: JS, CSS, HTML, JSON, Markdown ---
  # Prettier owns every file type here, so there is exactly one formatter and no
  # tool fights over Markdown. Upstream pre-commit/mirrors-prettier is archived;
  # rbubley's fork is the maintained mirror.
- repo: https://github.com/rbubley/mirrors-prettier
  rev: v3.9.6
  hooks:
  - id: prettier
    types_or: [javascript, css, html, json, markdown]

  # --- tests: at commit. 150ms on top of a ~1s gate, so there is no reason to
  # let a commit record a broken logic.js. Invoked directly rather than through
  # `npm test`, which doubles the cost in wrapper overhead alone. The UI driver
  # stays out: it needs Playwright and a browser binary, which not every clone
  # has, and it takes ~40s.
- repo: local
  hooks:
  - id: node-test
    name: node --test
    entry: node --test test/logic.test.js
    language: system
    pass_filenames: false
    always_run: true
